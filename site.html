<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Navegador</title>

<style>
body {
  margin: 0;
  background: #17191f;
  color: white;
  font-family: Arial;
}

header {
  padding: 20px;
  text-align: center;
  font-weight: bold;
}

.barra {
  display: flex;
  padding: 10px;
  gap: 8px;
}

input {
  flex: 1;
  width: 50%;
  padding: 13px;
  border: 0;
  border-radius: 8px;
  background: #343844;
  color: white;
}

button {
  background: #5865f2;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 12px;
}

iframe {
  width: 100%;
  height: 75vh;
  background: white;
  border: 0;
}

#alternativa {
  text-align: center;
  padding: 20px;
}
</style>
</head>

<body>

<header>🌐 ANÔNIMO </header>

<div class="barra">
  <input id="url" placeholder="https://www.xvideos.com">
  <button onclick="abrir()">Abrir</button>
</div>

<iframe id="pagina"></iframe>

<div id="alternativa">
  <p>Se o site não permitir visualização interna:</p>
  <button onclick="novaAba()">Abrir em nova aba ↗</button>
</div>

<script>
let endereco = "";

function validar() {
  let valor = document.getElementById("url").value.trim();

  if (!valor) return false;

  if (!/^https?:\/\//i.test(valor)) {
    valor = "https://" + valor;
  }

  try {
    let link = new URL(valor);

    if (!["http:", "https:"].includes(link.protocol))
      return false;

    endereco = link.href;
    return true;

  } catch {
    return false;
  }
}

function abrir() {
  if (!validar()) {
    alert("Link inválido!");
    return;
  }

  document.getElementById("pagina").src = endereco;
}

function novaAba() {
  if (!validar()) {
    alert("o Botão logo abaixo leva a um site exótico");
    return;
  }

  window.open(endereco, "_blank", "noopener,noreferrer");
}
</script>

</body>
</html>
