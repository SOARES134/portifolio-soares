
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soares Media Gallery</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #10131c;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 24px;
  background: #191e2b;
  text-align: center;
}

header h1 {
  margin: 0;
  color: #7889ff;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.painel {
  background: #1b2130;
  border: 1px solid #30394d;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #3a4258;
  background: #101722;
  color: white;
  margin: 8px 0;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #5865f2;
  color: white;
  cursor: pointer;
  margin-top: 7px;
}

button:hover {
  background: #7481ff;
}

.upload {
  display: block;
  padding: 16px;
  border: 2px dashed #5865f2;
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  margin-top: 12px;
}

.upload input {
  display: none;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 15px;
}

.item {
  background: #1b2130;
  border: 1px solid #30394d;
  border-radius: 12px;
  overflow: hidden;
}

.item img,
.item video {
  width: 100%;
  height: 190px;
  object-fit: cover;
  display: block;
  background: #080a10;
}

.acoes {
  padding: 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.acoes button {
  background: #d94455;
}

small {
  color: #9ba6bd;
}

</style>
</head>

<body>

<header>
  <h1>📸 SOARES MEDIA</h1>
  <p>Sua galeria de fotos e vídeos</p>
</header>

<main>

<section class="painel">

  <h2>Adicionar mídia</h2>

  <label class="upload">
    📁 Escolher fotos e vídeos
    <input
      type="file"
      id="arquivos"
      accept="image/*,video/*"
      multiple
    >
  </label>

  <h3>Ou adicionar por link</h3>

  <input
    type="url"
    id="link"
    placeholder="Cole o link da imagem ou vídeo"
  >

  <button onclick="adicionarLink()">
    Adicionar link
  </button>

  <p><small>
    Aceita imagens e vídeos com endereço direto.
  </small></p>

</section>

<h2>Minha galeria</h2>

<div class="galeria" id="galeria"></div>

</main>

<script>

const galeria = document.getElementById("galeria");

function criarItem(url, tipo, temporario = false) {

  const item = document.createElement("div");
  item.className = "item";

  let midia;

  if (tipo.startsWith("image/")) {
    midia = document.createElement("img");
    midia.alt = "Imagem da galeria";
  } else {
    midia = document.createElement("video");
    midia.controls = true;
    midia.playsInline = true;
  }

  midia.src = url;

  const acoes = document.createElement("div");
  acoes.className = "acoes";

  const texto = document.createElement("small");
  texto.textContent = tipo.startsWith("image/")
    ? "📸 Fotografia"
    : "🎬 Vídeo";

  const remover = document.createElement("button");
  remover.textContent = "Remover";

  remover.onclick = () => {
    item.remove();

    if (temporario) {
      URL.revokeObjectURL(url);
    }
  };

  acoes.append(texto, remover);
  item.append(midia, acoes);
  galeria.prepend(item);
}

document.getElementById("arquivos")
.addEventListener("change", function() {

  Array.from(this.files).forEach(file => {

    if (!file.type.startsWith("image/") &&
        !file.type.startsWith("video/")) return;

    const url = URL.createObjectURL(file);

    criarItem(url, file.type, true);

  });

  this.value = "";

});

function adicionarLink() {

  const campo = document.getElementById("link");
  const valor = campo.value.trim();

  if (!valor) return;

  try {

    const url = new URL(valor);

    if (!["https:", "http:"].includes(url.protocol)) {
      throw new Error();
    }

    const extensao = url.pathname.toLowerCase();

    let tipo;

    if (/\.(jpg|jpeg|png|gif|webp|avif|svg)$/.test(extensao)) {
      tipo = "image/external";
    } else if (/\.(mp4|webm|ogg|mov)$/.test(extensao)) {
      tipo = "video/external";
    } else {
      alert("Use um link direto de imagem ou vídeo.");
      return;
    }

    criarItem(valor, tipo);
    campo.value = "";

  } catch {
    alert("Link inválido!");
  }
}

</script>

</body>
</html>
