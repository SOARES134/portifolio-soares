
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navegador HTTPS</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101114;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  padding: 18px;
  background: #191b22;
  text-align: center;
}

.browser {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: #22252e;
}

input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #343844;
  color: white;
  outline: none;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 8px;
  background: #5865f2;
  color: white;
  cursor: pointer;
}

iframe {
  width: 100%;
  height: calc(100vh - 130px);
  border: none;
  background: white;
}
</style>
</head>

<body>

<header>
  <h2>🌐 Meu Navegador</h2>
</header>

<div class="browser">
  <input
    id="url"
    type="url"
    placeholder="https://exemplo.com"
  >

  <button onclick="abrirSite()">Abrir</button>
</div>

<iframe
  id="navegador"
  src="about:blank"
  allowfullscreen>
</iframe>

<script>
function abrirSite() {
  let url = document.getElementById("url").value.trim();

  if (!url) return;

  if (!/^https?:\/\//i.test(url)) {
    url = "https://" + url;
  }

  try {
    const endereco = new URL(url);

    if (!["https:", "http:"].includes(endereco.protocol)) {
      return;
    }

    document.getElementById("url").value = endereco.href;
    document.getElementById("navegador").src = endereco.href;

  } catch {
    alert("Endereço inválido!");
  }
}

document.getElementById("url").addEventListener("keydown", e => {
  if (e.key === "Enter") abrirSite();
});
</script>

</body>
</html>
